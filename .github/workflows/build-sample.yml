name: Build unsigned sample IPA

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/build-sample.yml'
      - 'vphone-indicator-probe/VPhoneIndicatorProbe/**'
      - 'vphone-indicator-probe/VPhoneIndicatorProbe.xcodeproj/**'
      - 'vphone-indicator-probe/scripts/**'
  pull_request:
    paths:
      - '.github/workflows/build-sample.yml'
      - 'vphone-indicator-probe/VPhoneIndicatorProbe/**'
      - 'vphone-indicator-probe/VPhoneIndicatorProbe.xcodeproj/**'
      - 'vphone-indicator-probe/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and verify unsigned device IPA
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select app version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          app_version=0.1.0
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must have the form vMAJOR.MINOR.PATCH.' >&2
              exit 1
            fi
            app_version="${RELEASE_TAG#v}"
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build and package unsigned IPA
        run: bash vphone-indicator-probe/scripts/build-unsigned-ipa.sh

      - name: Record build information
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo 'vPhone Indicator Probe — unsigned device build'
            echo "App version: $APP_VERSION"
            echo "Build number: $BUILD_NUMBER"
            echo "Source commit: $GITHUB_SHA"
            echo "Workflow run: $WORKFLOW_RUN_URL"
            echo 'Runner: macos-26'
            xcodebuild -version
            printf 'iPhoneOS SDK: '
            xcrun --sdk iphoneos --show-sdk-version
            echo 'Signing: disabled; no provisioning profile included'
            echo 'Compilation and packaging checks do not validate detection accuracy.'
          } > vphone-indicator-probe/build/UnsignedIPA/VPhoneIndicatorProbe-build-info.txt

      - name: Upload IPA, checksum, and build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vphone-indicator-probe/build/UnsignedIPA/VPhoneIndicatorProbe-unsigned.ipa
            vphone-indicator-probe/build/UnsignedIPA/VPhoneIndicatorProbe-unsigned.ipa.sha256
            vphone-indicator-probe/build/UnsignedIPA/VPhoneIndicatorProbe-build-info.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish unsigned IPA on a versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
          digest-mismatch: error

      - name: Verify IPA checksum
        working-directory: release-assets
        run: sha256sum --check VPhoneIndicatorProbe-unsigned.ipa.sha256

      - name: Create release with unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Unsigned sample app

          Download `VPhoneIndicatorProbe-unsigned.ipa` and its SHA-256 checksum below. The build-information file records the source commit and Xcode/SDK versions.

          This is an unsigned iOS device app, not an App Store package. Physical-device installation requires your own signing and provisioning. A compatible vPhone installation workflow may re-sign the app; that does not establish normal iOS installation acceptance.

          The workflow verifies compilation, unsigned packaging, and archive contents. It does not validate vPhone detection accuracy. The research findings remain scoped to the tested environments documented in the README.
          NOTES
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "$RELEASE_TAG — unsigned sample app" \
            --notes-file release-notes.md \
            release-assets/VPhoneIndicatorProbe-unsigned.ipa \
            release-assets/VPhoneIndicatorProbe-unsigned.ipa.sha256 \
            release-assets/VPhoneIndicatorProbe-build-info.txt
